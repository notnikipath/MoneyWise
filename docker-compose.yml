services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: moneywise-api-gateway
    env_file: .env
    ports:
      - "32092:8400"
    depends_on:
      - account-service
      - transaction-service
      - budget-service
      - goal-service
      - investment-service
      - analytics-service
      - notification-service
    networks: [moneywise-net]

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: moneywise-account
    env_file: .env
    ports:
      - "32093:8401"
    depends_on:
      - postgres
      - redis
    networks: [moneywise-net]

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: moneywise-transaction
    env_file: .env
    ports:
      - "32094:8402"
    depends_on:
      - postgres
      - redis
    networks: [moneywise-net]

  budget-service:
    build:
      context: .
      dockerfile: budget-service/Dockerfile
    container_name: moneywise-budget
    env_file: .env
    ports:
      - "32095:8403"
    depends_on:
      - postgres
      - redis
    networks: [moneywise-net]

  goal-service:
    build:
      context: .
      dockerfile: goal-service/Dockerfile
    container_name: moneywise-goal
    env_file: .env
    ports:
      - "32096:8404"
    depends_on:
      - postgres
      - redis
    networks: [moneywise-net]

  investment-service:
    build:
      context: .
      dockerfile: investment-service/Dockerfile
    container_name: moneywise-investment
    env_file: .env
    ports:
      - "32097:8405"
    depends_on:
      - postgres
      - redis
    networks: [moneywise-net]

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: moneywise-analytics
    env_file: .env
    ports:
      - "32098:8406"
    depends_on:
      - postgres
      - redis
    networks: [moneywise-net]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: moneywise-notification
    env_file: .env
    ports:
      - "32099:8407"
    depends_on:
      - redis
    networks: [moneywise-net]

  celery-worker:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: moneywise-celery
    env_file: .env
    command: celery -A app.tasks worker -l info
    depends_on:
      - analytics-service
      - redis
    networks: [moneywise-net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: moneywise-frontend
    env_file: .env
    ports:
      - "5277:5277"
    depends_on:
      - api-gateway
    networks: [moneywise-net]

  postgres:
    image: postgres:16
    container_name: moneywise-postgres
    environment:
      POSTGRES_DB: moneywise
      POSTGRES_USER: moneywise
      POSTGRES_PASSWORD: moneywise
    ports:
      - "55437:5432"
    volumes:
      - moneywise_postgres_data:/var/lib/postgresql/data
    networks: [moneywise-net]

  redis:
    image: redis:7
    container_name: moneywise-redis
    ports:
      - "6387:6379"
    networks: [moneywise-net]

networks:
  moneywise-net:
    driver: bridge

volumes:
  moneywise_postgres_data:
